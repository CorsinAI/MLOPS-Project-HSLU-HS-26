[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neghour"
version = "0.1.0"
description = "Predict negative DE-LU day-ahead electricity prices (HSLU MLOps HS26)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "hopsworks[python]==5.2.2",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
    "holidays==0.108",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
train = [
    "lightgbm==4.7.0",
    "scikit-learn==1.9.1",
    "mlflow==3.18.0",
    "dagshub==0.7.3",
]
app = [
    "streamlit==1.66.1",
]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neghour"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
