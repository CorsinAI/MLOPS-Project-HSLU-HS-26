[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neghour"
version = "0.1.0"
description = "Predict negative DE-LU day-ahead electricity prices (HSLU MLOps HS26)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hopsworks>=3.7",
    "lightgbm>=4.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "mlflow>=2.13",
    "dagshub",
    "streamlit>=1.35",
    "python-dotenv>=1.0",
    "holidays>=0.46",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neghour"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
