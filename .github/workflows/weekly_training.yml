name: Weekly training

# Training is not time-critical, so GitHub cron is good enough once enabled.
# The schedule stays off until the promotion rule is settled (decision #48).
on:
  # schedule:
  #   - cron: "0 2 * * 0"   # Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: retrain (rolling window, may register) or evaluate (test year, never registers)
        default: retrain
        required: true
        type: choice
        options: [retrain, evaluate]

concurrency:
  group: training
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra train

      - name: Run training pipeline
        env:
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'retrain' }}
        run: uv run --frozen python -m neghour.pipelines.training_pipeline --mode "$MODE"

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Training failed (run $GITHUB_RUN_ID)"
          --body "Training run failed: $RUN_URL"
