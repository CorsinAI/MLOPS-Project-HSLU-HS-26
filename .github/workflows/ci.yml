name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Check lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests scripts app

      - name: Run tests
        run: uv run --frozen pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t neghour .

      - name: Import the pipeline inside the image
        run: docker run --rm neghour .venv/bin/python -c "import neghour.pipelines.feature_pipeline"
