name: Inference

# Predicts every hour of Berlin tomorrow. Must start after 10:00 and finish
# before 12:00 Berlin. GitHub cron starts this repo's jobs hours late, so there
# is no cron here: the run is started by hand or by an external trigger that
# calls workflow_dispatch (decision #47). The pipeline refuses to start before
# the cut-off and marks a prediction made after 12:00 as late.
on:
  workflow_dispatch:
    inputs:
      delivery_date:
        description: Delivery day (YYYY-MM-DD); leave empty for Berlin tomorrow
        required: false

concurrency:
  group: inference
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record the real start time
        run: echo "Started $(date -u '+%Y-%m-%d %H:%M:%S') UTC" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra train

      - name: Run inference pipeline
        env:
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          DELIVERY_DATE: ${{ inputs.delivery_date }}
        run: |
          args=()
          if [ -n "$DELIVERY_DATE" ]; then args+=(--date "$DELIVERY_DATE"); fi
          uv run --frozen python -m neghour.pipelines.inference_pipeline "${args[@]}"

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Inference failed (run $GITHUB_RUN_ID)"
          --body "Inference run failed: $RUN_URL"
