name: Daily pipeline

on:
  schedule:
    # GitHub cron is UTC and has started this repo's jobs 4-9 hours late. Rows
    # are selected by timestamp, so a late run writes the same features.
    # Two morning slots, so the second repairs anything the first missed:
    #   01:17 UTC = 02:17 CET / 03:17 CEST
    #   05:17 UTC = 06:17 CET / 07:17 CEST
    # One slot after day-ahead publication, for the labels of the next day:
    #   12:17 UTC = 13:17 CET / 14:17 CEST
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

# One feature write at a time. A late run waits for the running one instead of
# writing the same rows in parallel; the running job is never cancelled. GitHub
# keeps one waiting run per group, so a newer waiting run replaces an older one,
# which would have done the same work.
concurrency:
  group: feature-writes
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    # A healthy run takes 6-15 minutes. Retries can add a few more.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run feature pipeline
        env:
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: uv run --frozen python -m neghour.pipelines.feature_pipeline

      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          gh issue create --repo "$GITHUB_REPOSITORY"
          --title "Daily pipeline failed (run $GITHUB_RUN_ID)"
          --body "Scheduled run failed: $RUN_URL"
