name: Daily pipeline

on:
  schedule:
    # GitHub cron is UTC and has started this repo's jobs 4-9 hours late, so
    # there are two slots. Rows are selected by timestamp, so a late run writes
    # the same features, and the second run repairs anything the first missed.
    #   01:17 UTC = 02:17 CET / 03:17 CEST
    #   05:17 UTC = 06:17 CET / 07:17 CEST
    - cron: "17 1 * * *"
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  feature-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run feature pipeline
        env:
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
        run: uv run --frozen python -m neghour.pipelines.feature_pipeline
